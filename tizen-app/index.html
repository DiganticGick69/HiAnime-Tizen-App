<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <title>HiAnime</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Samsung TV Web APIs (AVPlay). Missing in desktop browsers; the app falls back to <video>. -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<div id="stage">
    <nav id="sidebar">
        <div class="logo"><span class="logo-hi">hi</span><span class="logo-anime">anime</span></div>
        <div class="nav-item focusable" data-group="sidebar" data-route="home"><span class="ico" data-icon="home"></span><span class="lbl">Home</span></div>
        <div class="nav-item focusable" data-group="sidebar" data-route="search"><span class="ico" data-icon="search"></span><span class="lbl">Search</span></div>
        <div class="nav-item focusable" data-group="sidebar" data-route="categories"><span class="ico" data-icon="grid"></span><span class="lbl">Categories</span></div>
        <div class="nav-item focusable" data-group="sidebar" data-route="watched"><span class="ico" data-icon="history"></span><span class="lbl">Watched</span></div>
        <div class="nav-item focusable" data-group="sidebar" data-route="settings"><span class="ico" data-icon="gear"></span><span class="lbl">Settings</span></div>
    </nav>

    <main id="view" class="scroller"></main>

    <div id="player" class="hidden">
        <object id="av-player" type="application/avplayer"></object>
        <video id="html-player" class="hidden" playsinline></video>
        <div id="subtitle-box"></div>
        <div id="player-spinner" class="spinner hidden"></div>
        <div id="player-osd">
            <div class="osd-top">
                <div class="osd-title"></div>
                <div class="osd-sub"></div>
            </div>
            <div class="osd-bottom">
                <div class="osd-progress"><div class="osd-buffer"></div><div class="osd-fill"></div><div class="osd-knob"></div></div>
                <div class="osd-times"><span class="osd-cur">0:00</span><span class="osd-dur">0:00</span></div>
                <div class="osd-controls">
                    <div class="osd-btn focusable" data-group="osd" data-act="prev"><span class="ico" data-icon="prev"></span></div>
                    <div class="osd-btn focusable" data-group="osd" data-act="back10"><span class="ico" data-icon="rew"></span></div>
                    <div class="osd-btn osd-play focusable" data-group="osd" data-act="toggle"><span class="ico" data-icon="pause"></span></div>
                    <div class="osd-btn focusable" data-group="osd" data-act="fwd10"><span class="ico" data-icon="ffw"></span></div>
                    <div class="osd-btn focusable" data-group="osd" data-act="next"><span class="ico" data-icon="next"></span></div>
                    <div class="osd-spacer"></div>
                    <div class="osd-pill focusable" data-group="osd" data-act="lang">SUB</div>
                    <div class="osd-pill focusable" data-group="osd" data-act="cc">CC</div>
                    <div class="osd-pill focusable" data-group="osd" data-act="server">Server 1</div>
                </div>
            </div>
        </div>
        <div id="next-up" class="hidden"></div>
    </div>

    <div id="toast" class="hidden"></div>
</div>

<script src="js/icons.js"></script>
<script src="js/keys.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/player.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
